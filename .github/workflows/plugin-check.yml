name: Plugin Check

# WordPress.org Plugin Check against the release tree, on the latest
# WordPress and WooCommerce.
#
# REPORT-ONLY (continue-on-error, not a required check): Plugin Check runs its
# own ruleset and cannot see this repo's declared helpers (the custom nonce
# verifiers and the text/plain escaper in .phpcs.xml.dist), and it flags every
# query on the plugin's own tables. The blocking gate is `composer phpcs` in
# ci.yml. The CSV report is kept as an artifact; triage it before a
# WordPress.org submission.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: plugin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: src

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The exact tree release.yml zips (.distignore is the single list).
      - name: Stage the release tree
        run: |
          mkdir lafka-plugin
          rsync -a --exclude-from=src/.distignore src/ lafka-plugin/

      - name: Write wp-env config (latest WordPress + WooCommerce)
        run: |
          cat > .wp-env.json <<'JSON'
          {
            "core": null,
            "phpVersion": "8.3",
            "plugins": [
              "https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip",
              "https://downloads.wordpress.org/plugin/plugin-check.latest-stable.zip",
              "./lafka-plugin"
            ],
            "config": {
              "WP_DEBUG": true,
              "WP_ENVIRONMENT_TYPE": "development"
            }
          }
          JSON

      - name: Start wp-env
        run: npx -y @wordpress/env start

      - name: Run Plugin Check
        run: |
          npx -y @wordpress/env run cli wp plugin activate woocommerce plugin-check lafka-plugin
          npx -y @wordpress/env run cli wp plugin check lafka-plugin \
            --require=./wp-content/plugins/plugin-check/cli.php \
            --format=csv | tee plugin-check.csv
          if grep -qE ',(ERROR|WARNING),' plugin-check.csv; then
            echo "::error::Plugin Check reported errors or warnings (see the plugin-check-report artifact)."
            exit 1
          fi

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-check-report
          path: plugin-check.csv
          retention-days: 14
          if-no-files-found: ignore
