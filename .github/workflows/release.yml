name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# POLICY: first-party GitHub-org actions only; publishing uses the runner's
# pre-installed `gh` CLI.

jobs:
  # A tag ships only code that passes every CI gate.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may write: it creates the GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build zip
        # .distignore is the single list of dev-only paths.
        run: |
          mkdir lafka-plugin
          rsync -a --exclude-from=.distignore ./ lafka-plugin/
          zip -qr lafka-plugin.zip lafka-plugin/
          sha256sum lafka-plugin.zip > lafka-plugin.zip.sha256
          cat lafka-plugin.zip.sha256

      # The GitHub updater looks for the asset name `lafka-plugin.zip`.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" lafka-plugin.zip lafka-plugin.zip.sha256 --clobber
