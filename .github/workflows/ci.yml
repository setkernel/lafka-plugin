name: CI

on:
  workflow_dispatch:
  # release.yml calls this workflow so a tag only ships code that passes it.
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

# Read-only by default; no job here needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# POLICY: first-party GitHub-org actions only (actions/*, github/*). PHP is
# the runner's pre-installed PHP 8.3, which is the plugin's PHP floor
# (`Requires PHP` in the plugin header); PHPCompatibilityWP checks 8.3+
# statically. Every gate below is the same npm/composer script the pre-push
# hook runs.

jobs:
  lint-js-css:
    name: Version, ESLint, Stylelint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Version single source of truth
        run: npm run check-version

      - run: npm ci --no-audit --no-fund

      - name: ESLint (zero warnings)
        run: npm run lint:js

      - name: Stylelint (zero warnings)
        run: npm run lint:css

      - name: Committed .min.js files match their sources
        run: |
          npm run build
          git diff --exit-code -- '*.min.js'

  php:
    name: PHP syntax & PHPCS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Show PHP + Composer versions
        run: |
          php --version
          composer --version

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        run: composer lint:php

      - name: PHPCS (warnings fail)
        run: composer phpcs

  # Blocks a PR that adds a vulnerable dependency (moderate or worse).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  # The single status check for branch protection.
  ci-passed:
    name: CI passed
    needs: [lint-js-css, php]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        env:
          JOBS_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [ "$JOBS_FAILED" = "true" ]; then
            echo "::error::One or more required jobs failed, were cancelled or were skipped."
            exit 1
          fi
          echo "All required CI jobs passed."
